# Nginx production configuration template for OCOP Vietnam
# Direct Path-Based Micro-Frontend Gateway (Zero Double-Proxy Bottleneck)

# 1. Custom JSON Log Format
log_format ocop_json escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"client_ip":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
'}';

# 2. Rate Limiting Zone (10 requests per second with burst up to 30)
limit_req_zone $binary_remote_addr zone=ocop_limit:10m rate=10r/s;

# 3. Upstream Configuration (6 Independent Micro-Services)
upstream ocop_web_shell {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream ocop_stories {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream ocop_tourism_destinations {
    server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream ocop_news_events {
    server 127.0.0.1:3003 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream ocop_products {
    server 127.0.0.1:3004 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream ocop_api_gateway {
    server 127.0.0.1:3006 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 4. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name ocopvietnam.vn www.ocopvietnam.vn;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 5. HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ocopvietnam.vn www.ocopvietnam.vn;

    # SSL Certificates (paths to be adjusted on server)
    ssl_certificate /etc/letsencrypt/live/ocopvietnam.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ocopvietnam.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Access & Error Logging with JSON format
    access_log /var/log/nginx/ocop_access.json ocop_json;
    error_log /var/log/nginx/ocop_error.log warn;

    # Standard HSTS Header (without preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # =========================================================================
    # STATIC ASSET ROUTING DIRECTLY TO EACH TARGET MICRO-FRONTEND
    # =========================================================================

    # Products static assets
    location /products-static/ {
        proxy_pass http://ocop_products;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # News & Events static assets
    location /news-static/ {
        proxy_pass http://ocop_news_events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # OCOP Stories static assets
    location /stories-static/ {
        proxy_pass http://ocop_stories;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Tourism Destinations static assets
    location /destinations-static/ {
        proxy_pass http://ocop_tourism_destinations;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Web-Shell static assets
    location /_next/static/ {
        proxy_pass http://ocop_web_shell;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Global Shared fonts & public images (served via web-shell)
    location ~* ^/(fonts|images)/ {
        proxy_pass http://ocop_web_shell;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800";
    }

    # =========================================================================
    # DIRECT PATH-BASED PAGE ROUTING (ZERO DOUBLE-PROXYING)
    # =========================================================================

    # 1. Products micro-frontend (Port 3004)
    location /san-pham-ocop {
        limit_req zone=ocop_limit burst=30 nodelay;
        proxy_pass http://ocop_products;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. News & Events micro-frontend (Port 3003)
    location = /tin-tuc-su-kien {
        limit_req zone=ocop_limit burst=30 nodelay;
        proxy_pass http://ocop_news_events/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tin-tuc-su-kien/ {
        limit_req zone=ocop_limit burst=30 nodelay;
        proxy_pass http://ocop_news_events/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(tin-tuc|su-kien|ocop-hoi-nhap|chinh-sach-va-co-che|ocop-dia-phuong|xuc-tien-thuong-mai) {
        limit_req zone=ocop_limit burst=30 nodelay;
        proxy_pass http://ocop_news_events;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. OCOP Stories micro-frontend (Port 3001)
    location /cau-chuyen-ocop {
        limit_req zone=ocop_limit burst=30 nodelay;
        proxy_pass http://ocop_stories;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Tourism Destinations micro-frontend (Port 3002)
    location /diem-den-du-lich {
        limit_req zone=ocop_limit burst=30 nodelay;
        proxy_pass http://ocop_tourism_destinations;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. REST API Gateway (Port 3006)
    location /api/ {
        limit_req zone=ocop_limit burst=30 nodelay;
        proxy_pass http://ocop_api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Default root Shell & Homepage (Port 3000)
    location / {
        limit_req zone=ocop_limit burst=30 nodelay;
        proxy_pass http://ocop_web_shell;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
